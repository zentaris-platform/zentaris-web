<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Zentaris enquiries</title>
	</head>
	<body>
		<form name="enquiries" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
			<input type="hidden" name="form-name" value="enquiries" />
			<p>
				<label>Leave blank <input name="bot-field" /></label>
			</p>
			<p><label>Name <input type="text" name="name" /></label></p>
			<p><label>Email <input type="email" name="email" /></label></p>
			<p>
				<label
					>What do you need?
					<select name="service">
						<option>A new website</option>
						<option>Digital marketing</option>
						<option>Branding / logo</option>
						<option>All three</option>
						<option>Not sure yet</option>
					</select>
				</label>
			</p>
			<p><label>About your business <textarea name="message"></textarea></label></p>
		</form>
	</body>
</html>
