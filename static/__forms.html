<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Zentaris enquiries</title>
	</head>
	<body>
		<form name="enquiries" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
			<input type="hidden" name="form-name" value="enquiries" />
			<p>
				<label>Leave blank <input name="bot-field" /></label>
			</p>
			<p><label>Name <input type="text" name="name" /></label></p>
			<p><label>Email <input type="email" name="email" /></label></p>
			<p>
				<label
					>What are you looking to build?
					<select name="service">
						<option value="">Select an area</option>
						<option>Fintech & Payment Solutions</option>
						<option>Enterprise Technology</option>
						<option>Emerging Technologies</option>
						<option>Technology Consulting</option>
						<option>Marketing & Brand Growth</option>
					</select>
				</label>
			</p>
			<p>
				<label>Services <input type="checkbox" name="services" /></label>
			</p>
			<p>
				<label>What stage are you at? <input type="radio" name="stage" /></label>
			</p>
			<p>
				<label>Something else in mind? <textarea name="message"></textarea></label>
			</p>
		</form>
	</body>
</html>
