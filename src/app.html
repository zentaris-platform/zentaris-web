<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#E7E3E0" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/favicon/apple-touch-icon-180.png" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
